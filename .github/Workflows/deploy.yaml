name: End-to-End Enterprise Deployment (Validation Mode)

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:

  terraform-stage:
    runs-on: ubuntu-latest
    steps:
    - name: Get code from GitHub
      uses: actions/checkout@v4
      
    - name: Setup Terraform Environment
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.5.7
      
    - name: Format Code Check
      run: terraform fmt -check
      
    - name: Initialize Terraform (Validation Mode)
      run: terraform init -backend=false
      
    - name: Validate Code Syntax
      run: terraform validate

    - name: Run Checkov Security Scan
      uses: bridgecrewio/checkov-action@master
      with:
        framework: terraform
        soft_fail: true

  kubernetes-stage:
    runs-on: ubuntu-latest
    needs: terraform-stage
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      
    - name: Validate Kubernetes Manifests Syntax
      run: |
        echo "Executing Client-Side Dry-Run Validation for Kubernetes Manifests..."
        python3 -c "import yaml; yaml.safe_load(open('deployment.yaml'))"
        python3 -c "import yaml; yaml.safe_load(open('service.yaml'))"
        python3 -c "import yaml; yaml.safe_load(open('hpa.yaml'))"
        echo "Status: SUCCESS - All manifests are structurally sound and ready for deployment."